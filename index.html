/* Layout: faixa de filtros fixa no topo, KPIs, ranking de conferentes, gráfico diário + matriz por linha */
:root{
  --bg:#eef0f2;--surface:#fff;--ink:#14202b;--muted:#5d6b78;--line:#d9dee3;
  --accent:#0b5cad;--flag:#c2570c;--good:#1d7a4d;
  --c1:#0b5cad;--c2:#e08a00;--c3:#2a9d8f;--c4:#8e5bb5;--c5:#98a4af;
  --display:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Barlow','Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10171e;--surface:#18222c;--ink:#e6ecf1;--muted:#93a1ae;--line:#2a3743;
  --accent:#5aa4ee;--flag:#f0944a;--good:#4cc38a;

:root[data-theme="dark"]{
  --bg:#10171e;--surface:#18222c;--ink:#e6ecf1;--muted:#93a1ae;--line:#2a3743;
  --accent:#5aa4ee;--flag:#f0944a;--good:#4cc38a;
  --c1:#5aa4ee;--c2:#f2a93b;--c3:#46c2b3;--c4:#b88be0;--c5:#6d7b88;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--body);padding-block:0 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{padding-top:20px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:8px}
h1{font:700 34px/1 var(--display);letter-spacing:.01em;margin:0;text-transform:uppercase}
.sub{color:var(--muted);font-size:13px}
h2{font:600 18px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.filters{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:end}
.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select,input[type=number]{font:500 14px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-height:34px}
input[type=number]{width:84px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 13px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 10px;min-height:34px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.kpi b{display:block;font:700 34px/1.05 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:760px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font:600 12px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;cursor:pointer;user-select:none}
th[aria-sort]{color:var(--ink)}
th .ar{display:inline-block;width:10px}
td.name{font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px}
.bar{position:relative;min-width:130px}
.bar i{position:absolute;left:10px;bottom:4px;height:3px;background:var(--accent);opacity:.5;border-radius:2px;max-width:calc(100% - 20px)}
.bar span{position:relative}
.warn{color:var(--flag);font-weight:600}
.low{color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
@media(max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin:10px 0 0}
svg{display:block;width:100%;height:auto}
svg text{fill:var(--muted);font:12px var(--body)}
.hm{width:100%;min-width:0;min-width:340px}
.hm td,.hm th{text-align:center;padding:8px 6px}
.hm td:first-child,.hm th:first-child{text-align:left}
.hm td.c{position:relative;font-weight:500}
.hm td.c::before{content:"";position:absolute;inset:3px;background:var(--accent);opacity:var(--p);border-radius:3px}
.hm td.c span{position:relative}
.note{font-size:13px;color:var(--muted);margin:10px 0 0;max-width:80ch}
.note b{color:var(--ink)}
</style>

     return `<td class="c" style="--p:${(p*.55).toFixed(2)}"><span>${v?fmt(v):'·'}</span></td>`}).join('')+'</tr>').join('')+'</tbody>';
}
